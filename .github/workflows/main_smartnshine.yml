# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - SmartNShine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and test backend
        working-directory: ./server
        run: |
          npm ci || npm install
          npm run test --if-present

      - name: Create deployment zip package
        run: |
          cd server
          zip -r ../release.zip . -x "*.git*" "uploads/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .
      
      - name: Deploy to Azure Web App (Publish Profile)
        if: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D92532B6A3C44305917BD1A9537D4422 != '' }}
        id: deploy-to-webapp-publish-profile
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SmartNShine'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D92532B6A3C44305917BD1A9537D4422 }}
          package: ./release.zip

      - name: Login to Azure (OIDC fallback)
        if: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D92532B6A3C44305917BD1A9537D4422 == '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D92532B6A3C44305917BD1A9537D4422 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_967643D92A4D409EB0FD5180BBB75E1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E23374B9CE404AACA2B53B9BF027A6D8 }}

      - name: Deploy to Azure Web App (OIDC fallback)
        if: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D92532B6A3C44305917BD1A9537D4422 == '' }}
        id: deploy-to-webapp-oidc
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SmartNShine'
          slot-name: 'Production'
          package: ./release.zip
          